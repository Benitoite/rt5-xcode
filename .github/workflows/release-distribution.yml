name: Signed and notarized distribution

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: rawtherapee-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  intel-component:
    name: Build the Intel x86_64 component
    # Plain macos-14 is arm64; -large is GitHub's Intel Sonoma image.
    runs-on: macos-14-large
    timeout-minutes: 240

    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/DerivedData
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - name: Check out the project and RawTherapee
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Verify the RawTherapee submodule
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f RawTherapee5/rawtherapee/CMakeLists.txt ]]; then
            echo "::error::The RawTherapee Gitlink is missing or its submodule was not initialized."
            exit 1
          fi

          git submodule status --recursive
          rawtherapee_version="$(
            git -C RawTherapee5/rawtherapee describe --tags --always
          )"
          if [[ "$rawtherapee_version" != *.* ]]; then
            echo "::error::RawTherapee version metadata is unavailable: ${rawtherapee_version}"
            exit 1
          fi
          printf 'RawTherapee version: %s\n' "$rawtherapee_version"

      - name: Show the Intel build environment
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          macos_version="$(sw_vers -productVersion)"
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          printf 'macOS SDK: %s\n' "$sdk_version"
          uname -m
          df -h "$GITHUB_WORKSPACE"

          if [[ "${macos_version%%.*}" != "14" ]]; then
            echo "::error::The Intel component must run on macOS 14 Sonoma."
            exit 1
          fi
          if [[ "$(uname -m)" != "x86_64" ]]; then
            echo "::error::The Intel component must run on x86_64."
            exit 1
          fi

      - name: Install Intel build dependencies
        shell: bash
        run: |
          set -euo pipefail

          if brew tap | grep -Fxq aws/tap; then
            brew untap aws/tap
          fi

          brew install \
            adwaita-icon-theme \
            automake \
            cmake \
            exiv2 \
            expat \
            fftw \
            fmt \
            gtk+3 \
            gtk-mac-integration \
            gtkmm3 \
            jpeg-xl \
            lensfun \
            libiptcdata \
            libomp \
            libpng \
            libsigc++@2 \
            libtiff \
            little-cms2 \
            pkgconfig \
            shared-mime-info

          df -h "$GITHUB_WORKSPACE"

      - name: Build the Intel application component
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project RawTherapee5.xcodeproj \
            -scheme RawTherapee \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            ARCHS=x86_64 \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            ONLY_ACTIVE_ARCH=YES \
            build |
            tee "$RUNNER_TEMP/xcodebuild-intel.log"

          application="$DERIVED_DATA_PATH/Build/Products/Release/RawTherapee.app"
          [[ -d "$application" ]] || {
            echo "::error::The Intel application was not produced."
            exit 1
          }

          while IFS= read -r -d '' candidate; do
            if /usr/bin/file -b "$candidate" | /usr/bin/grep -q 'Mach-O'; then
              candidate_architectures="$(/usr/bin/lipo -archs "$candidate")"
              if [[ "$candidate_architectures" != "x86_64" ]]; then
                echo "::error::Intel component contains ${candidate_architectures}: ${candidate}"
                exit 1
              fi
            fi
          done < <(
            /usr/bin/find \
              "$application/Contents/MacOS" \
              "$application/Contents/Frameworks" \
              -type f -print0
          )

          /bin/mkdir -p "$GITHUB_WORKSPACE/intel-component"
          /usr/bin/ditto \
            "$application" \
            "$GITHUB_WORKSPACE/intel-component/RawTherapee.app"

      - name: Cache the Intel countercomponent for the arm64 job
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: intel-component
          key: rawtherapee-intel-${{ github.run_id }}

  distribution:
    name: Build the arm64 app and universal distribution
    needs: intel-component
    runs-on: macos-26
    timeout-minutes: 240
    environment: release

    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/DerivedData
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NOTARY_PROFILE: RawTherapee5

    steps:
      - name: Check out the project and RawTherapee
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Verify the RawTherapee submodule
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f RawTherapee5/rawtherapee/CMakeLists.txt ]]; then
            echo "::error::The RawTherapee Gitlink is missing or its submodule was not initialized."
            echo "::error::Commit the mode-160000 RawTherapee5/rawtherapee entry before running this workflow."
            exit 1
          fi

          git submodule status --recursive
          rawtherapee_version="$(
            git -C RawTherapee5/rawtherapee describe --tags --always
          )"
          if [[ "$rawtherapee_version" != *.* ]]; then
            echo "::error::RawTherapee version metadata is unavailable: ${rawtherapee_version}"
            exit 1
          fi
          printf 'RawTherapee version: %s\n' "$rawtherapee_version"

      - name: Restore the Intel countercomponent
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: intel-component
          key: rawtherapee-intel-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Validate the Intel countercomponent
        shell: bash
        run: |
          set -euo pipefail
          intel_app="$GITHUB_WORKSPACE/intel-component/RawTherapee.app"
          intel_engine="$intel_app/Contents/MacOS/rawtherapee-bin"
          [[ -x "$intel_engine" ]] || {
            echo "::error::The restored Intel engine is missing."
            exit 1
          }
          [[ "$(/usr/bin/lipo -archs "$intel_engine")" == "x86_64" ]]

      - name: Validate required release secrets
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          missing=0
          for variable in \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing release environment secret: ${variable}"
              missing=1
            fi
          done

          if (( missing != 0 )); then
            exit 1
          fi

          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID must be a 10-character Apple Developer Team ID."
            exit 1
          fi

      - name: Show the build environment
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          printf 'macOS SDK: %s\n' "$sdk_version"
          uname -m
          df -h "$GITHUB_WORKSPACE"

          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "::error::Universal assembly must run on arm64."
            exit 1
          fi
          if (( ${sdk_version%%.*} < 26 )); then
            echo "::error::The arm64 runner does not provide the required macOS 26 SDK."
            exit 1
          fi

      - name: Install RawTherapee build and packaging dependencies
        shell: bash
        run: |
          set -euo pipefail

          if brew tap | grep -Fxq aws/tap; then
            brew untap aws/tap
          fi

          brew install \
            adwaita-icon-theme \
            automake \
            cmake \
            create-dmg \
            exiv2 \
            expat \
            fftw \
            fmt \
            gtk+3 \
            gtk-mac-integration \
            gtkmm3 \
            imagemagick \
            jpeg-xl \
            lensfun \
            libiptcdata \
            libomp \
            libpng \
            libsigc++@2 \
            libtiff \
            little-cms2 \
            pkgconfig \
            shared-mime-info \
            simde

          df -h "$GITHUB_WORKSPACE"

      - name: Import the Developer ID Application identity
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/rawtherapee-signing.keychain-db"
          keychain_password="$(/usr/bin/openssl rand -hex 32)"

          echo "::add-mask::$keychain_password"
          echo "CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" |
            /usr/bin/base64 --decode > "$certificate_path"
          [[ -s "$certificate_path" ]] || {
            echo "::error::The decoded certificate file is empty."
            exit 1
          }

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s \
            "$keychain_path" \
            "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$keychain_path"

          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          identities="$(security find-identity -v -p codesigning "$keychain_path")"
          if ! grep -Fq "Developer ID Application:" <<< "$identities"; then
            echo "::error::The P12 does not contain a Developer ID Application identity and private key."
            exit 1
          fi
          if ! grep -Fq "($APPLE_TEAM_ID)" <<< "$identities"; then
            echo "::error::The Developer ID identity does not belong to APPLE_TEAM_ID."
            exit 1
          fi

          echo "Developer ID Application identity imported successfully."

      - name: Configure the local signing team
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          sed \
            -e "s/^RAWTHERAPEE_DEVELOPMENT_TEAM[[:space:]]*=.*/RAWTHERAPEE_DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}/" \
            -e "s/^RAWTHERAPEE_NOTARY_PROFILE[[:space:]]*=.*/RAWTHERAPEE_NOTARY_PROFILE = ${NOTARY_PROFILE}/" \
            XcodeSupport/LocalSigning.xcconfig.example \
            > XcodeSupport/LocalSigning.xcconfig

      - name: Create and validate the temporary notarytool profile
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

          xcrun notarytool history --keychain-profile "$NOTARY_PROFILE" >/dev/null
          echo "Apple notarization credentials validated successfully."

      - name: Build the signed and notarized distribution
        shell: bash
        run: |
          set -euo pipefail

          intel_app="$GITHUB_WORKSPACE/intel-component/RawTherapee.app"
          [[ -d "$intel_app" ]] || {
            echo "::error::The Intel countercomponent is unavailable."
            exit 1
          }

          xcodebuild \
            -project RawTherapee5.xcodeproj \
            -scheme "RawTherapee Distribution" \
            -configuration Distribution \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            ARCHS=arm64 \
            MACOSX_DEPLOYMENT_TARGET=26.0 \
            ONLY_ACTIVE_ARCH=YES \
            RAWTHERAPEE_UNIVERSAL_COUNTERPART_APP="$intel_app" \
            build |
            tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Validate the named-folder distribution ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          application="$DERIVED_DATA_PATH/Build/Products/Distribution/RawTherapee.app"
          [[ -d "$application" ]] || {
            echo "::error::The universal application was not produced."
            exit 1
          }

          while IFS= read -r -d '' candidate; do
            if /usr/bin/file -b "$candidate" | /usr/bin/grep -q 'Mach-O'; then
              candidate_architectures="$(/usr/bin/lipo -archs "$candidate")"
              if [[ "$candidate_architectures" != "arm64 x86_64" &&
                    "$candidate_architectures" != "x86_64 arm64" ]]; then
                echo "::error::Universal app contains ${candidate_architectures}: ${candidate}"
                exit 1
              fi
            fi
          done < <(
            /usr/bin/find \
              "$application/Contents/MacOS" \
              "$application/Contents/Frameworks" \
              -type f -print0
          )

          arm64_minimum="$(
            /usr/libexec/PlistBuddy \
              -c "Print :LSMinimumSystemVersionByArchitecture:arm64" \
              "$application/Contents/Info.plist"
          )"
          x86_64_minimum="$(
            /usr/libexec/PlistBuddy \
              -c "Print :LSMinimumSystemVersionByArchitecture:x86_64" \
              "$application/Contents/Info.plist"
          )"
          printf 'Minimum macOS: arm64=%s, x86_64=%s\n' \
            "$arm64_minimum" "$x86_64_minimum"

          if [[ "$arm64_minimum" != "26.0" ]]; then
            echo "::error::The arm64 component must require macOS 26 Tahoe; found ${arm64_minimum}."
            exit 1
          fi
          if [[ "$x86_64_minimum" != "12.0" ]]; then
            echo "::error::The x86_64 component must require macOS 12 Monterey; found ${x86_64_minimum}."
            exit 1
          fi

          zip_artifacts=(dist/*.zip)
          if (( ${#zip_artifacts[@]} != 1 )); then
            echo "::error::The distribution build did not produce exactly one ZIP."
            exit 1
          fi

          zip_path="${zip_artifacts[0]}"
          if [[ "$(basename "$zip_path")" != \
                "RawTherapee_MacOS_${arm64_minimum}_Universal_"*.zip ]]; then
            echo "::error::The ZIP name is not the arm64-versioned Universal artifact: ${zip_path}"
            exit 1
          fi
          artifact_base="$(basename "${zip_path%.zip}")"
          archive_folder="${artifact_base}/"
          dmg_name="${artifact_base}.dmg"
          entries="$(/usr/bin/unzip -Z1 "$zip_path")"
          entry_count="$(printf '%s\n' "$entries" | /usr/bin/wc -l | /usr/bin/tr -d ' ')"

          if [[ "$entry_count" != "5" ]]; then
            echo "::error::The distribution ZIP must contain one named folder and exactly four files."
            printf '%s\n' "$entries"
            exit 1
          fi

          for required_entry in \
            "$archive_folder" \
            "${archive_folder}install-readme.rtf" \
            "${archive_folder}${dmg_name}" \
            "${archive_folder}rawtherapee-cli" \
            "${archive_folder}About-this-build.txt"
          do
            if ! grep -Fxq "$required_entry" <<< "$entries"; then
              echo "::error::Missing distribution ZIP entry: ${required_entry}"
              exit 1
            fi
          done

          about_this_build="$(/usr/bin/unzip -p "$zip_path" "${archive_folder}About-this-build.txt")"
          for expected_line in \
            "Minimum macOS (arm64): ${arm64_minimum}" \
            "Minimum macOS (x86_64): ${x86_64_minimum}" \
            "Version and resources: arm64 component"
          do
            /usr/bin/grep -Fqx "$expected_line" <<< "$about_this_build"
          done
          /usr/bin/unzip -p "$zip_path" "${archive_folder}About-this-build.txt"

      - name: Upload the notarized distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload Xcode logs after a failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RawTherapee-failed-build-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ github.workspace }}/DerivedData/Logs/Build/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -e "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [[ -n "${CERTIFICATE_PATH:-}" ]]; then
            rm -f "$CERTIFICATE_PATH"
          fi
          rm -f XcodeSupport/LocalSigning.xcconfig
